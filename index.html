<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>CATENARIA — Innovative IT Solutions</title>
<meta name="description" content="Vibe Codeを、Production-Ready水準へ。AIで形にしたプロダクトの完成度を、エンジニアの視点で本番品質まで磨き上げる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0a0a;
    --bg-1:      #0e0e0e;
    --surface:   #131313;
    --surface-2: #181818;
    --line:      rgba(255,255,255,0.07);
    --line-2:    rgba(255,255,255,0.14);
    --text:      #ffffff;
    --text-2:    #c4c4c4;
    --text-3:    #a8a8a8;
    --accent:     #e8b537;
    --accent-hi:  #f6d569;
    --accent-glow: rgba(232,181,55,0.22);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; background: #0a0a0a; color-scheme: dark; }
  html, body { min-height: 100%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  #bg-layer { position: fixed; inset: 0; background: #0a0a0a; z-index: -1; }
  body {
    background: #0a0a0a; color: var(--text);
    font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
    font-weight: 300; line-height: 1.9; letter-spacing: 0.01em; font-size: 15px;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 40px; }
  @media (max-width: 720px) { .wrap { padding: 0 24px; } }
  ::selection { background: var(--accent); color: #0a0a0a; }

  #progress {
    position: fixed; top: 0; left: 0; height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, var(--accent)); z-index: 100; transition: width 0.1s linear;
  }

  /* Header */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    transition: background 0.4s var(--ease), border-color 0.4s var(--ease), backdrop-filter 0.4s; border-bottom: 1px solid transparent; }
  header.scrolled { background: rgba(10,10,11,0.72); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 78px; }
  .brand-lockup { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .brand-lockup svg { width: 26px; height: auto; display: block; }
  .brand-word { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 16px; letter-spacing: 0.42em; color: var(--text); padding-left: 0.42em; }
  .nav-links { display: flex; align-items: center; gap: 40px; }
  .nav-links a { font-family: 'Montserrat','Noto Sans JP',sans-serif; font-weight: 400; font-size: 12.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-2); text-decoration: none; position: relative; padding: 4px 0; transition: color 0.3s var(--ease); }
  .nav-links a::after { content: ""; position: absolute; left: 0; bottom: -2px; height: 1px; width: 0; background: var(--accent); transition: width 0.35s var(--ease); }
  .nav-links a:hover { color: var(--text); }
  .nav-links a:hover::after { width: 100%; }
  .btn { font-family: 'Montserrat','Noto Sans JP',sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.08em;
    text-decoration: none; display: inline-flex; align-items: center; gap: 10px; padding: 13px 26px; border-radius: 2px; cursor: pointer;
    transition: all 0.32s var(--ease); border: 1px solid transparent; }
  .btn-accent { background: var(--accent); color: #0a0a0a; box-shadow: 0 0 0 0 var(--accent-glow); }
  .btn-accent:hover { background: var(--accent-hi); box-shadow: 0 8px 34px -8px var(--accent-glow); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line-2); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-hi); }
  .nav .btn { padding: 11px 22px; }
  @media (max-width: 860px) { .nav-links { display: none; } }

  /* Hero */
  .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-top: 78px; overflow: hidden; }
  .hero-motif { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -54%); width: min(86vw, 760px); height: auto; z-index: 0; pointer-events: none; }
  .hero-motif .cat-path { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .hero-apex { fill: var(--accent); filter: drop-shadow(0 0 9px var(--accent)); opacity: 0; }
  .hero-inner { position: relative; z-index: 2; }
  .kicker { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 30px; display: inline-flex; align-items: center; }
  .hero h1 { font-family: 'Montserrat','Noto Sans JP',sans-serif; font-weight: 600; line-height: 1.32; letter-spacing: 0.02em;
    font-size: clamp(2rem, 5.4vw, 4rem); margin-bottom: 30px; max-width: 16em; }
  .hero h1 .accent { color: var(--accent); }
  .hero h1 .thin { font-weight: 200; }
  .hero p.sub { font-size: clamp(0.95rem, 1.5vw, 1.0625rem); color: var(--text-2); max-width: 32em; line-height: 2.1; margin-bottom: 44px; font-weight: 300; }
  .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }

  /* Section frame */
  section.block { padding: 130px 0; position: relative; }
  section.block.alt { background: var(--bg-1); }
  .sec-head { margin-bottom: 66px; }
  .sec-label { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 16px; display: inline-flex; align-items: center; }
  .sec-title { font-family: 'Montserrat','Noto Sans JP',sans-serif; font-weight: 500; font-size: clamp(1.6rem, 3.4vw, 2.4rem); letter-spacing: 0.04em; line-height: 1.4; }
  .sec-lead { color: var(--text-2); max-width: 34em; margin-top: 22px; line-height: 2.1; }

  /* Services */
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; gap: 16px; } }
  .card { background: var(--surface); border: 1px solid var(--line); padding: 44px 40px; position: relative; transition: background 0.4s var(--ease), border-color 0.4s var(--ease); overflow: hidden; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.45s var(--ease); }
  .card:hover { background: var(--surface-2); border-color: var(--line-2); }
  .card:hover::before { transform: scaleX(1); }
  .card-name { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 21px; letter-spacing: 0.04em; margin: 0 0 4px; }
  .card-role { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .card-desc { color: var(--text-2); font-size: 14.5px; line-height: 1.95; margin-bottom: 26px; min-height: 3.8em; }
  .card-for { font-size: 13px; color: var(--text); padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .card-for .lbl { color: var(--text-3); white-space: nowrap; font-size: 12px; }
  .card-meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .card-term { font-size: 12px; color: var(--text-2); letter-spacing: 0.06em; }
  .card-price { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 19px; letter-spacing: 0.02em; color: var(--text); }
  .card-price small { font-weight: 300; font-size: 12px; color: var(--text-3); }
  .price-note { margin-top: 34px; padding: 22px 28px; border-left: 2px solid var(--accent); background: var(--surface); color: var(--text-2); font-size: 14px; line-height: 2; }

  /* Figure / cycle */
  .figure { margin-top: 80px; text-align: center; }
  .figure-cap { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--text-3); margin-bottom: 36px; }
  .cycle { width: 100%; max-width: 560px; height: auto; margin: 0 auto; display: block; }
  .cycle text { fill: var(--text); font-family: 'Montserrat', sans-serif; }
  .cycle .jp { font-family: 'Noto Sans JP', sans-serif; fill: var(--text-3); }
  .cycle .edge { stroke: var(--line-2); fill: none; }
  .cycle .node-core { fill: var(--accent); }
  .figure-note { max-width: 30em; margin: 34px auto 0; color: var(--text-2); font-size: 13.5px; line-height: 2; }

  /* Flow */
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
  @media (max-width: 820px) { .flow { grid-template-columns: 1fr; } }
  .step { position: relative; padding: 0 24px; }
  .step:not(:last-child)::after { content: ""; position: absolute; top: 13px; right: -1px; width: 1px; height: calc(100% - 13px); background: var(--line); }
  @media (max-width: 820px) { .step { padding: 28px 0; border-bottom: 1px solid var(--line); } .step:not(:last-child)::after { display: none; } }
  .step-num { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.1em; color: var(--accent); display: inline-block; margin-bottom: 18px; position: relative; }
  .step-num::before { content: ""; position: absolute; left: -24px; top: 7px; width: 18px; height: 1px; background: var(--accent); }
  @media (max-width: 820px) { .step-num::before { display: none; } }
  .step-title { font-weight: 500; font-size: 16px; margin-bottom: 10px; letter-spacing: 0.04em; }
  .step-desc { color: var(--text-2); font-size: 13.5px; line-height: 1.9; }
  .flow-loop { margin-top: 50px; text-align: center; color: var(--text-3); font-size: 12.5px; letter-spacing: 0.16em; font-style: italic; font-family: 'Montserrat','Noto Sans JP',sans-serif; }

  /* About */
  .traits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 70px; }
  @media (max-width: 820px) { .traits { grid-template-columns: 1fr; } }
  .trait { background: var(--surface); padding: 42px 36px; }
  .trait-mark { font-family: 'Montserrat', sans-serif; font-weight: 300; font-style: italic; font-size: 28px; color: var(--accent); line-height: 1; margin-bottom: 24px; }
  .trait h4 { font-weight: 500; font-size: 17px; line-height: 1.6; margin-bottom: 14px; letter-spacing: 0.03em; }
  .trait p { color: var(--text-2); font-size: 14px; line-height: 1.95; }
  .profile { border-top: 1px solid var(--line); }
  .profile-row { display: grid; grid-template-columns: 200px 1fr; gap: 30px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 640px) { .profile-row { grid-template-columns: 1fr; gap: 6px; } }
  .profile-row dt { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-3); padding-top: 3px; }
  .profile-row dd { color: var(--text); font-size: 14.5px; line-height: 1.85; }
  .profile-row dd .en { color: var(--text-3); font-size: 12px; letter-spacing: 0.04em; }
  .profile-row dd a { color: var(--accent); text-decoration: none; }

  /* FAQ */
  .faq { border-top: 1px solid var(--line); }
  .faq-item { border-bottom: 1px solid var(--line); }
  .faq-q { width: 100%; background: none; border: none; cursor: pointer; color: var(--text); text-align: left; font-family: inherit; font-size: 16px; font-weight: 400; padding: 28px 50px 28px 0; position: relative; letter-spacing: 0.02em; line-height: 1.6; }
  .faq-q .plus { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; transition: transform 0.4s var(--ease); }
  .faq-q .plus::before, .faq-q .plus::after { content: ""; position: absolute; background: var(--accent); transition: opacity 0.3s; }
  .faq-q .plus::before { top: 7px; left: 0; width: 16px; height: 1.5px; }
  .faq-q .plus::after { left: 7px; top: 0; width: 1.5px; height: 16px; }
  .faq-item.open .plus::after { opacity: 0; }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.45s var(--ease); }
  .faq-a-inner { padding: 0 50px 30px 0; color: var(--text-2); font-size: 14.5px; line-height: 2; }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: start; }
  @media (max-width: 820px) { .contact-grid { grid-template-columns: 1fr; gap: 44px; } }
  .contact-pitch h3 { font-family: 'Montserrat','Noto Sans JP',sans-serif; font-weight: 500; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.5; letter-spacing: 0.03em; margin-bottom: 26px; }
  .contact-pitch p { color: var(--text-2); line-height: 2.1; margin-bottom: 30px; }
  .contact-alt { font-size: 13.5px; color: var(--text-3); }
  .contact-alt a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.3s; }
  .contact-alt a:hover { border-color: var(--accent); }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  .field input, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-family: inherit; font-size: 15px; padding: 14px 16px; border-radius: 2px; transition: border-color 0.3s var(--ease); resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { min-height: 130px; }
  #form-btn { width: 100%; justify-content: center; }
  .form-thanks { color: var(--accent); font-size: 14px; margin-top: 18px; letter-spacing: 0.04em; }

  /* Footer */
  footer { padding: 80px 0 56px; border-top: 1px solid var(--line); }
  .foot-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; flex-wrap: wrap; margin-bottom: 60px; }
  .foot-brand svg { width: 34px; height: auto; margin-bottom: 18px; }
  .foot-word { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.42em; padding-left: 0.42em; }
  .foot-tag { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.3em; color: var(--text-3); margin-top: 8px; text-transform: uppercase; }
  .foot-nav { display: flex; gap: 36px; flex-wrap: wrap; }
  .foot-nav a { font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-2); text-decoration: none; transition: color 0.3s; }
  .foot-nav a:hover { color: var(--accent); }
  .foot-bottom { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .foot-bottom span, .foot-bottom a { font-size: 11px; color: var(--text-3); letter-spacing: 0.08em; text-decoration: none; }
  .foot-bottom a:hover { color: var(--text-2); }

  /* Reveal */
  @media (prefers-reduced-motion: no-preference) {
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .reveal.d1 { transition-delay: 0.08s; }
    .reveal.d2 { transition-delay: 0.16s; }
    .reveal.d3 { transition-delay: 0.24s; }
  }

  /* Mobile refinements */
  @media (max-width: 640px) {
    section.block { padding: 84px 0; }
    .hero { min-height: 90vh; }
    .hero h1 { margin-bottom: 24px; }
    .hero p.sub { margin-bottom: 32px; }
    .hero-cta { gap: 12px; width: 100%; }
    .hero-cta .btn { flex: 1 1 auto; justify-content: center; }
    .sec-head { margin-bottom: 44px; }
    .card { padding: 32px 24px; }
    .price-note { padding: 20px 22px; }
    .traits { margin-bottom: 48px; }
    .nav { height: 64px; }
    .nav .btn { padding: 10px 16px; font-size: 12px; letter-spacing: 0.04em; }
    .brand-word { font-size: 14px; letter-spacing: 0.30em; padding-left: 0.30em; }
    .brand-lockup svg { width: 22px; }
    footer { padding: 60px 0 44px; }
    .foot-top { margin-bottom: 40px; gap: 28px; }
    .contact-pitch h3 { font-size: 1.5rem; }
  }
  @media (max-width: 400px) {
    .wrap { padding: 0 18px; }
    .hero h1 { font-size: 1.85rem; }
  }
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="top"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function catenaryPath(W, H, tautness, N) {
  const hw = W / 2, a = hw * tautness;
  const denom = Math.cosh(hw / a) - 1;
  let d = "";
  for (let i = 0; i <= N; i++) {
    const x = -hw + (W * i / N);
    const y = H * (Math.cosh(x / a) - 1) / denom;
    d += (i === 0 ? "M" : "L") + (x + hw).toFixed(2) + " " + y.toFixed(2) + " ";
  }
  return d.trim();
}
const CATENARY_D = catenaryPath(100, 120, 0.33, 140);

function CatenaryMark({ width = 26, stroke = "var(--text)", apex = true, className }) {
  return (
    <svg viewBox="0 0 100 120" aria-hidden="true" className={className}
      style={{ width, height: "auto", display: "block" }}>
      <path d={CATENARY_D} fill="none" stroke={stroke} strokeWidth="1.4" vectorEffect="non-scaling-stroke" />
      {apex && <circle cx="50" cy="0" r="2.6" fill="var(--accent)" />}
    </svg>
  );
}

function HeroMotif() {
  const pathRef = useRef(null);
  const apexRef = useRef(null);
  useEffect(() => {
    const hp = pathRef.current, apex = apexRef.current;
    if (!hp) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { apex.style.opacity = 1; return; }
    const len = hp.getTotalLength();
    hp.style.strokeDasharray = len; hp.style.strokeDashoffset = len;
    hp.style.transition = "stroke-dashoffset 2.4s cubic-bezier(0.2,0.7,0.2,1)";
    const r1 = requestAnimationFrame(() => requestAnimationFrame(() => {
      hp.style.strokeDashoffset = 0;
      setTimeout(() => { apex.style.transition = "opacity 1.1s ease"; apex.style.opacity = 1; }, 1700);
    }));
    return () => cancelAnimationFrame(r1);
  }, []);
  return (
    <svg className="hero-motif" viewBox="0 0 100 120" aria-hidden="true">
      <path ref={pathRef} className="cat-path" d={CATENARY_D} />
      <circle ref={apexRef} className="hero-apex" cx="50" cy="0" r="2.4" />
    </svg>
  );
}

function useReveal(rootRef) {
  useEffect(() => {
    const root = rootRef.current || document;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    root.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

const NAV = [
  { href: "#services", label: "Services" },
  { href: "#flow", label: "Flow" },
  { href: "#about", label: "About" },
  { href: "#faq", label: "FAQ" },
];

function Header() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <header id="header" className={scrolled ? "scrolled" : ""}>
      <div className="wrap nav">
        <a href="#top" className="brand-lockup" aria-label="CATENARIA home">
          <CatenaryMark width={26} stroke="var(--text)" apex={false} />
          <span className="brand-word">CATENARIA</span>
        </a>
        <nav className="nav-links" aria-label="主要ナビゲーション">
          {NAV.map((n) => <a key={n.href} href={n.href}>{n.label}</a>)}
        </nav>
        <a href="#contact" className="btn btn-accent">無料で相談する</a>
      </div>
    </header>
  );
}

function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return <div id="progress" style={{ width: w + "%" }} />;
}
